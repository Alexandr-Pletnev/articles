.job-build:
  stage: build
  environment: dev
  services:
    - name: docker:dind
      command:
        - "--tls=false"
  extends:
    - .script-build
  variables:
    REGEX_KEY_AUTO: /\|(build|build-auto)\|/i
    REGEX_KEY_MANUAL: /\|build-manual\|/i

.job-test:
  stage: test
  environment: dev
  services:
    - name: docker:dind
      command:
        - "--tls=false"
  extends:
    - .script-test
  variables:
    REGEX_KEY_AUTO: '/\|(test|test-auto)\|/i'
    REGEX_KEY_MANUAL: '/\|test-manual\|/i'

.job-deploy-dbg:
  stage: debug
  environment: debug
  allow_failure: true
  services:
    - name: docker:dind
      command:
        - "--tls=false"
  extends:
    - .script-deploy
  variables:
    REGEX_KEY_AUTO: /\|(deploy-dbg|deploy-dbg-auto)\|/i
    REGEX_KEY_MANUAL: /\|deploy-dbg-manual\|/i
    SERVICE_IMAGE: $SERVICE_NAME:debug
    DC_FOLDER: /home/deployer/evrica/environments/debug

.job-deploy-dev:
  stage: deploy-d
  environment: dev
  services:
    - name: docker:dind
