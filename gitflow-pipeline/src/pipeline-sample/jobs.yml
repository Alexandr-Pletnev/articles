    SERVICE_IMAGE: $SERVICE_NAME:prod
    DC_FOLDER: /home/deployer/evrica/environments/prod

.job-mr-rules:
  stage: approval
  services:
    - name: docker:dind
      command:
        - "--tls=false"
  extends:
